# A full manual test of jqmc on a self-hosted runner.

name: jqmc full test workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: jqmc full test + Codecov / Python ${{ matrix.python-version }}

    if: github.repository == 'jqmc-project/jQMC'

    runs-on:
      group: jqmc-nightly-runners
      labels: [self-hosted, Linux, X64]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.14", "3.11.9", "3.12.3"]

    timeout-minutes: 720

    steps:
    - name: Show runner information
      run: |
        hostname
        uname -a
        cat /etc/os-release

    - uses: actions/checkout@v4

    - name: Select Python
      run: |
        PY="$HOME/.pyenv/versions/${{ matrix.python-version }}/bin"
        echo "$PY" >> "$GITHUB_PATH"
        "$PY/python" --version

    - name: Setup Open MPI
      run: |
        source /etc/profile.d/modules.sh
        module load mpi/openmpi-x86_64
        echo "$(dirname "$(which mpirun)")" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        mpirun --version
        mpicc --version

    - name: Install jqmc
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov
        python -m pip install .

    - name: Test jqmc FP64 (Intra-software comparisons)
      run: |
        pytest -s -v tests/test_trexio.py --cov=jqmc --cov-branch --no-cov-on-fail
        # pytest -s -v tests/test_init_electron_configurations.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_structure.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_AOs.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_MOs.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_determinant.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_jastrow.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_wave_function.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_ecps.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_swct.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_mcmc_force.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_lrdmc_force.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_checkpoint_components.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_checkpoint_mcmc.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_checkpoint_gfmc.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_ao_basis_optimization.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_mixed_precision.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append

    - name: Test jqmc FP32+FP64 (Intra-software comparisons)
      run: |
        pytest -s -v tests/test_trexio.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_init_electron_configurations.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_structure.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_AOs.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_MOs.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_determinant.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_jastrow.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_wave_function.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_ecps.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_swct.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_mcmc_force.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_lrdmc_force.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_checkpoint_components.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_checkpoint_mcmc.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_checkpoint_gfmc.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_ao_basis_optimization.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed
        # pytest -s -v tests/test_mixed_precision.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append --precision-mode=mixed

    - name: Test jqmc FP64 (Inter-software comparisons)
      run: |
        pytest -s -v tests/test_comparison_with_turborvb_ECP.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_comparison_with_turborvb_AE.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append

    - name: Test jqmc FP64 (QMC kernels without MPI, FP64)
      run: |
        pytest -s -v tests/test_jqmc_command_lines.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_jqmc_mcmc.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_jqmc_gfmc_tau.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_jqmc_gfmc_bra.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append

    - name: Test jqmc FP32+FP64 (QMC kernels without MPI, FP32+FP64)
      run: |
        pytest -s -v tests/test_jqmc_mcmc.py --precision-mode=mixed --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_jqmc_gfmc_tau.py --precision-mode=mixed --cov=jqmc --cov-branch --no-cov-on-fail --cov-append
        # pytest -s -v tests/test_jqmc_gfmc_bra.py --precision-mode=mixed --cov=jqmc --cov-branch --no-cov-on-fail --cov-append

    - name: Test jqmc FP64 (QMC kernels with 2MPIs, FP64)
      run: |
        mpirun -np 2 pytest -s -v tests/test_jqmc_mcmc.py
        # mpirun -np 2 pytest -s -v tests/test_jqmc_gfmc_tau.py
        # mpirun -np 2 pytest -s -v tests/test_jqmc_gfmc_bra.py

    - name: Test jqmc FP32+FP64 (QMC kernels with 2MPIs, FP32+FP64)
      run: |
        mpirun -np 2 pytest -s -v tests/test_jqmc_mcmc.py --precision-mode=mixed
        # mpirun -np 2 pytest -s -v tests/test_jqmc_gfmc_tau.py --precision-mode=mixed
        # mpirun -np 2 pytest -s -v tests/test_jqmc_gfmc_bra.py --precision-mode=mixed

    - name: Test jqmc-tool (Toolset for jqmc)
      run: |
        pytest -s -v tests/test_jqmc_tool.py --cov=jqmc --cov-branch --no-cov-on-fail --cov-append

    # - name: Combine Codecov xml files
    #   run: |
    #     python -m coverage xml -o coverage.xml

