# A short test jqmc.

name: jqmc short test

on:
  push:
    branches: [ "devel*" ]
    paths-ignore:
      - '.gitignore'
      - '.github/**'
      - 'doc/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'README.md'
      - '.pre-commit-config.yaml'
      - 'jqmc_workflow/**'
  pull_request:
    branches: [ "devel*" ]
    paths-ignore:
      - '.gitignore'
      - '.github/**'
      - 'doc/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'README.md'
      - '.pre-commit-config.yaml'
      - 'jqmc_workflow/**'

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Install gfortran and gcc
      run: |
        sudo apt-get update
        sudo apt-get install gfortran

    - name: Install OpenBLAS and LAPACK
      run: sudo apt-get install libopenblas-dev liblapack-dev

    - name: Install OpenMPI
      run: sudo apt-get install openmpi-bin libopenmpi-dev

    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install jqmc
      run: |
        python -m pip install flake8 pytest pytest-cov
        python -m pip install .

    - name: Lint (pre-commit, currently-enforced hooks)
      # Runs hooks declared in .pre-commit-config.yaml:
      #   - ruff (RUF001/002/003 ambiguous-unicode only, --no-fix)
      #   - ruff-format
      #   - ascii-only (scripts/check_ascii.sh)
      #   - trailing-whitespace, end-of-file-fixer, check-added-large-files
      # To enforce additional ruff rules, fix the violations listed in
      # `lint.extend-ignore` in pyproject.toml and remove them from that list.
      run: |
        python -m pip install pre-commit
        pre-commit run --all-files

    - name: Test jqmc FP64 (intra-software comparisons)
      run: |
        pytest -s -v tests/test_trexio.py --skip-heavy
        pytest -s -v tests/test_init_electron_configurations.py --skip-heavy
        pytest -s -v tests/test_structure.py --skip-heavy
        pytest -s -v tests/test_AOs.py --skip-heavy
        pytest -s -v tests/test_MOs.py --skip-heavy
        pytest -s -v tests/test_determinant.py --skip-heavy
        pytest -s -v tests/test_jastrow.py --skip-heavy
        pytest -s -v tests/test_wave_function.py --skip-heavy
        pytest -s -v tests/test_ecps.py --skip-heavy
        pytest -s -v tests/test_swct.py --skip-heavy
        pytest -s -v tests/test_mcmc_force.py --skip-heavy
        pytest -s -v tests/test_lrdmc_force.py --skip-heavy
        pytest -s -v tests/test_mixed_precision.py --precision-mode=mixed --skip-heavy

    - name: Test jqmc FP32+FP64 (intra-software comparisons)
      run: |
        pytest -s -v tests/test_trexio.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_init_electron_configurations.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_structure.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_AOs.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_MOs.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_determinant.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_jastrow.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_wave_function.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_ecps.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_swct.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_mcmc_force.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_lrdmc_force.py --skip-heavy --precision-mode=mixed
        pytest -s -v tests/test_mixed_precision.py --skip-heavy --precision-mode=mixed
