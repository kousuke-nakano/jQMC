# Machine definitions for jqmc-workflow
# Edit this file to match your environment.
#
# Required fields for every machine:
#   machine_type    : "local" or "remote"
#   queuing         : true or false
#   workspace_root  : absolute path where job working dirs live
#   jobsubmit       : command used to invoke the submit script (required
#                     even when queuing=false -- for a plain local run use
#                     "bash" or "sh"; for a scheduler use "qsub" / "sbatch")
#
# Required additionally when queuing: true:
#   jobcheck        : command that lists jobs in the queue (e.g. "qstat")
#   jobdel          : command that cancels a job by id (e.g. "qdel")
#   jobnum_index    : 0-based token index of the job-id field in
#                     jobsubmit's stdout (qsub prints "1234.host" -> 0;
#                     sbatch prints "Submitted batch job 1234" -> 3)
#
# Required additionally when machine_type: remote:
#   ssh_host        : Host alias in ~/.ssh/config (the top-level YAML key
#                     above is a nickname and does NOT need to match)
#
# Optional:
#   jobacct         : scheduler accounting command (e.g. "qstat -fx")

# Local execution without a batch scheduler (synchronous).
# queuing: false  ->  bash runs submit.sh synchronously; no PID tracking needed.
localhost:
  machine_type: local
  queuing: false
  workspace_root: /home/username/jqmc_work
  jobsubmit: "bash"   # required: command that runs the submit script

# Local execution without a batch scheduler (asynchronous / background).
# queuing: true   ->  bash launches submit.sh in the background and prints PID;
#                     ps -eo pid= is used to poll; kill to cancel.
# localhost-async:
#   machine_type: local
#   queuing: true
#   workspace_root: /home/username/jqmc_work
#   jobsubmit: "bash -c 'bash \"$1\" &>/dev/null & echo $!' --"
#   jobcheck: "ps -eo pid="
#   jobdel: "kill"
#   jobnum_index: 0

# Example remote machine (PBS):
# my-pbs-cluster:
#   ssh_host: pbs-cluster          # Host alias in ~/.ssh/config
#   machine_type: remote
#   queuing: true
#   workspace_root: /home/username/jqmc_work
#   jobsubmit: /opt/pbs/bin/qsub
#   jobcheck: /opt/pbs/bin/qstat
#   jobdel: /opt/pbs/bin/qdel
#   jobnum_index: 0

# Example remote machine (SLURM):
# my-slurm-cluster:
#   ssh_host: slurm-cluster        # Host alias in ~/.ssh/config
#   machine_type: remote
#   queuing: true
#   workspace_root: /home/username/jqmc_work
#   jobsubmit: sbatch
#   jobcheck: squeue --noheader
#   jobdel: scancel
#   jobnum_index: 3
