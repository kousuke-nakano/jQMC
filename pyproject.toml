[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

# pyproject.toml
[tool.setuptools_scm]
write_to = "jqmc/_version.py"
local_scheme = "no-local-version"

[tool.ruff]
line-length = 128
lint.select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle errors + warnings
    "B",      # flake8-bugbear
    "I",      # isort
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "C4",     # comprehensions
    "PIE",    # idiom
    "SIM",    # simplify
    "RET",    # return
    "G",      # logging-format
    "T20",    # print
    "NPY",    # numpy
    "PT",     # pytest-style
    "PERF",   # performance
    "RUF",    # ruff-specific (includes RUF001-003)
]
lint.extend-ignore = [
    # --- Pre-existing intentional ignores ---
    "I001", "B008", "B023", "D417", "D100", "E501", "E741",
    "G004",    # f-string in logger (jQMC convention)
    "RUF012",  # mutable class default (flax struct.dataclass false positive)
    "RUF013",  # implicit Optional (`X = None` then `if X is None` is OK)
    "PERF203", # try-except in loop (sometimes required)
    "PT011",   # pytest.raises too broad
    "SIM108",  # ternary if-else (sometimes if-block is more readable)
    # --- TODO: currently-violating rules; fix and remove from this list ---
    # bugbear
    "B007", "B010", "B904", "B905",
    # flake8-comprehensions
    "C401", "C408", "C409", "C414", "C416", "C419", "C420",
    # pydocstyle
    "D101", "D102", "D103", "D104", "D105", "D107", "D200", "D202",
    "D205", "D209", "D210", "D212", "D301", "D403", "D415", "D416",
    # pycodestyle errors
    "E101", "E401", "E402", "E701", "E702", "E721", "E902",
    # pyflakes
    "F401", "F541", "F811", "F841",
    # logging-format
    "G003",
    # numpy
    "NPY002",
    # performance
    "PERF401", "PERF402",
    # flake8-pie
    "PIE790", "PIE808",
    # flake8-pytest-style
    "PT006", "PT012", "PT018",
    # flake8-return
    "RET501", "RET503", "RET504", "RET505", "RET506", "RET507", "RET508",
    # ruff-specific (RUF001/002/003 are ENFORCED — never add here)
    "RUF005", "RUF010", "RUF019", "RUF021", "RUF022", "RUF023",
    "RUF046", "RUF059", "RUF100",
    # flake8-simplify
    "SIM101", "SIM102", "SIM103", "SIM105", "SIM114", "SIM115", "SIM118", "SIM300",
    # flake8-print
    "T201",
    # pyupgrade
    "UP006", "UP007", "UP009", "UP015", "UP022", "UP024", "UP031",
    "UP032", "UP033", "UP034", "UP035", "UP037", "UP045",
    # pycodestyle warnings
    "W291", "W293", "W605",
]
exclude = ["jqmc/obsolete", "prototypes"]

[tool.ruff.lint.pydocstyle]
convention = "google"
